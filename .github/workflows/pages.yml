name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: actions/configure-pages@v6.0.0
      - name: Update the contribution calendar
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 25 --retry 2 --retry-all-errors \
            --header 'Accept: text/html' --header 'Accept-Language: en-US' \
            --output "$RUNNER_TEMP/github-contributions.html" \
            'https://github.com/users/wzj1228516103/contributions'
          node scripts/build-calendar.mjs "$RUNNER_TEMP/github-contributions.html"
      - name: Update project star counts
        continue-on-error: true
        run: node scripts/build-project-stars.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
