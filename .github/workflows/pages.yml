name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: actions/configure-pages@v6.0.0
      - name: Update the contribution calendar
        # Keep the checked-in public snapshot if GitHub's calendar is unavailable.
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 25 --retry 2 --retry-all-errors \
            --header 'Accept: text/html' --header 'Accept-Language: en-US' \
            --output "$RUNNER_TEMP/github-contributions.html" \
            'https://github.com/users/wzj1228516103/contributions'
          node scripts/build-calendar.mjs "$RUNNER_TEMP/github-contributions.html"
      - name: Update project star counts
        continue-on-error: true
        run: node scripts/build-project-stars.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        id: upload
        with:
          path: dist
      - name: Wait for the Pages artifact to become available
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            artifact=$(timeout 4s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID" \
              --jq 'select(.name == "github-pages" and .expired == false) | .id') || continue
            if [ -n "$artifact" ] && [ "$artifact" = "$PAGES_ARTIFACT_ID" ]; then
              echo "Pages artifact $artifact is available."
              # Allow the deploy action's separate artifact index to catch up.
              sleep 8
              exit 0
            fi
          done
          echo "::error::The uploaded Pages artifact did not become available in time."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
